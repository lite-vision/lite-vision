[workspace]
resolver = "2"
members = [
    "crates/truth",
    "crates/intelligence",
    "crates/rpack",
    "crates/storage",
    "crates/net",
    "crates/sdk",
    "crates/cli",
    "crates/observability",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Lite-Vision Team"]
repository = "https://github.com/lite-vision/lite-vision"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
blake3 = "1.5"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
rand = "0.8"
bincode = "1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
